# Render blueprint for the Blushy API.
#
# Every secret below is marked `sync: false`, which means Render prompts for it
# and never stores it in this file. Nothing here should ever hold a real key.
services:
  - type: web
    name: blushy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Atlas connection string. The local 127.0.0.1 database is not reachable
      # from a hosted service, so this has to be a hosted cluster.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Email. Brevo is tried before SMTP.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Blushy
      # Off in production regardless -- this is belt and braces. With it on, a
      # failed send hands the verification code back in the API response, which
      # lets anyone register an address they do not control.
      - key: EMAIL_DELIVERY_FALLBACK_ENABLED
        value: "false"
      - key: AI_CHAT_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        sync: false
      - key: AI_CHAT_API_URL
        sync: false
      - key: SPEECH_TO_TEXT_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID_ANDROID
        sync: false
      - key: GOOGLE_CLIENT_ID_WEB
        sync: false
